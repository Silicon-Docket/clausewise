name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A throwaway PostgreSQL for packages/azure's database tests, which are skipped without one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLAUSEWISE_TEST_POSTGRES_URL: postgresql://127.0.0.1:5432/clausewise_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Prepare the test database
        run: |
          psql -h 127.0.0.1 -U postgres \
            -c "CREATE ROLE clausewise_migrate LOGIN" \
            -c "CREATE ROLE clausewise_web LOGIN" \
            -c "CREATE ROLE clausewise_worker LOGIN" \
            -c "CREATE DATABASE clausewise_test OWNER clausewise_migrate"
      - run: pnpm test
