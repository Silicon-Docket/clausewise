name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to the commit of the release named beside each, as in release.yml.

jobs:
  check:
    runs-on: ubuntu-latest
    # A throwaway PostgreSQL for packages/azure's database tests, which are skipped without one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLAUSEWISE_TEST_POSTGRES_URL: postgresql://127.0.0.1:5432/clausewise_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Prepare the test database
        run: |
          psql -h 127.0.0.1 -U postgres \
            -c "CREATE ROLE clausewise_migrate LOGIN" \
            -c "CREATE ROLE clausewise_web LOGIN" \
            -c "CREATE ROLE clausewise_worker LOGIN" \
            -c "CREATE DATABASE clausewise_test OWNER clausewise_migrate"
      - run: pnpm test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the server image
        run: docker build --platform linux/amd64 --tag clausewise-server:ci .
      - name: It runs as a non-root user and refuses to start without its settings
        run: |
          test "$(docker inspect --format '{{.Config.User}}' clausewise-server:ci)" = "65532:65532"
          for command in web worker migrate; do
            set +e
            docker run --rm --read-only clausewise-server:ci "$command" 2> stderr.txt
            code=$?
            set -e
            cat stderr.txt
            test "$code" -eq 1
            grep -q "^Missing settings" stderr.txt
          done
          set +e
          docker run --rm --read-only clausewise-server:ci unknown
          code=$?
          set -e
          test "$code" -eq 64

  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the Azure templates
        run: |
          az bicep install
          az bicep build --file deploy/azure/foundation/main.bicep --stdout > /dev/null
          az bicep build --file deploy/azure/application/main.bicep --stdout > /dev/null
